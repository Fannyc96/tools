<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家私備忘錄">
<meta name="theme-color" content="#FFFBEF">
<title>家私備忘錄</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@800&display=swap');

/* 版面與美妝避雷針一致：奶油底、白卡片、藍色重點；頁首不固定，分頁列往下滑時固定在頂端 */
:root {
  --bg:        #FFFBEF;
  --card:      #FFFFFF;
  --card-alt:  #FFF5D6;
  --hdr:       #9DC4F0;
  --hdr-dk:    #3D5A78;
  --brown:     #185FA5;
  --mid:       #3D5A78;
  --lime:      #9DC4F0;
  --border:    #A8C4E0;
  --border-lt: #C8DCEF;
  --txt:       #1A2A3C;
  --txt-mid:   #3D5A78;
  --txt-muted: #6F8BA8;
  --packed:    #185FA5;
  --packed-bg: #E4EFFF;
  --later:     #8A6200;
  --later-bg:  #FFF5CC;
  --skip:      #68727D;
  --skip-bg:   #F0F2F4;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── Header ── */
.hdr { padding-top: max(32px, env(safe-area-inset-top)); padding-bottom: 14px; }
.hdr-title {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: clamp(30px, 6vw, 44px);
  line-height: 1.2;
  letter-spacing: .01em;
  color: var(--txt);
}
.hdr-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.hbtn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 400; line-height: 1.5;
  color: var(--txt); background: transparent;
  border: 1px solid var(--border-lt); border-radius: 999px;
  padding: 5px 14px; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.hbtn svg { color: var(--packed); }
.hbtn:hover { border-color: var(--packed); }
.hbtn.active { background: var(--packed); border-color: var(--packed); color: #fff; }
.hbtn.active svg { color: #fff; }

/* ── Tabs ── */
.tabs-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--border-lt);
}
.tabs { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: flex; align-items: center; gap: 6px;
  padding: 12px 10px 10px;
  font-size: 15px; font-weight: 500; color: var(--txt-muted);
  border-bottom: 2px solid transparent; white-space: nowrap;
  cursor: pointer; user-select: none; transition: color .15s;
}
.tab:first-child { padding-left: 2px; }
.tab:hover { color: var(--txt-mid); }
.tab.active { color: var(--brown); border-bottom-color: var(--brown); }
.cnt {
  font-size: 12px; font-weight: 700; line-height: 1.6;
  min-width: 22px; padding: 0 6px; border-radius: 999px; text-align: center;
  background: var(--packed-bg); color: var(--txt-mid);
}
.tab.active .cnt { background: var(--brown); color: #fff; }

/* ── Main ── */
.main { padding-top: 14px; padding-bottom: max(28px, env(safe-area-inset-bottom)); }

/* ── Category card ── */
.cat-card {
  background: var(--bg); border: 1px solid var(--border-lt); border-radius: 14px;
  margin-bottom: 14px; overflow: hidden;
}
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.cat-head {
  padding: 14px 16px 12px; background: var(--packed-bg);
  border-bottom: 1px solid var(--border-lt);
  display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
}
.cat-title { font-weight: 700; font-size: 17px; color: var(--txt); flex: 1; min-width: 60px; }
.cat-prog { font-size: 13px; color: var(--txt-mid); font-variant-numeric: tabular-nums; }

.bulk-wrap { flex-basis: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.bbtn {
  min-height: 34px; padding: 4px 8px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: background .15s, color .15s;
}
.bbtn.bp     { background: var(--card); color: var(--packed); border: 1px solid #9DC4F0; }
.bbtn.bp.on  { background: var(--packed); color: #fff; border-color: var(--packed); }
.bbtn.bl     { background: var(--later-bg); color: var(--later); border: 1px solid #E7CA72; }
.bbtn.bl.on  { background: var(--later); color: #fff; border-color: var(--later); }
.bbtn.bs     { background: var(--skip-bg); color: var(--skip); border: 1px solid #C7CDD3; }
.bbtn.bs.on  { background: var(--skip); color: #fff; border-color: var(--skip); }
.bbtn:hover  { filter: brightness(0.96); }

/* ── Item row：名稱在左、圖示按鈕在右，一行 ── */
.item-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 10px 16px; border-bottom: 1px solid #EDE5D3;
  transition: background .1s;
}
.item-row:last-child { border-bottom: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--border); transition: background .2s; }
.s-packed .dot { background: var(--packed); }
.s-later  .dot { background: var(--later); }
.s-skip   .dot { background: var(--skip); }

.item-name { flex: 1; min-width: 0; font-size: 16px; line-height: 1.45; color: var(--txt); overflow-wrap: anywhere; transition: color .2s; }
.s-packed .item-name { color: var(--packed); }
.s-later  .item-name { color: var(--later); }
.s-skip   .item-name { color: var(--skip); text-decoration: line-through; }

.item-btns { display: flex; gap: 6px; flex-shrink: 0; }
.ibtn {
  width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  display: inline-grid; place-items: center;
  border: 1.5px solid transparent; background: var(--card);
  transition: background .15s, color .15s, border-color .15s;
}
.ibtn.ip     { border-color: #9DC4F0; color: var(--packed); }
.ibtn.ip.on  { background: var(--packed); border-color: var(--packed); color: #fff; }
.ibtn.il     { border-color: #E7CA72; color: var(--later); }
.ibtn.il.on  { background: var(--later); border-color: var(--later); color: #fff; }
.ibtn.is     { border-color: #C7CDD3; color: var(--skip); }
.ibtn.is.on  { background: var(--skip); border-color: var(--skip); color: #fff; }
.ibtn.ih     { border-color: #8FAF6A; color: #3F5A24; }
.ibtn.ih.on  { background: #9CC97A; border-color: #9CC97A; color: #1F3A0C; }
.ibtn.it     { border-color: #B99A6A; color: #6B4B20; }
.ibtn.it.on  { background: #C9A76A; border-color: #C9A76A; color: #3A2408; }
.ibtn:hover:not(.on) { background: var(--bg); }
.ibtn:focus-visible, .bbtn:focus-visible, .hbtn:focus-visible, .tab:focus-visible { outline: 2px solid var(--packed); outline-offset: 2px; }

.home-summary {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  background: var(--card); border: 1px solid var(--border-lt); border-radius: 12px;
  padding: 10px 16px; margin-bottom: 14px; font-size: 14px; color: var(--txt-mid);
}
.home-summary span { display: inline-flex; align-items: center; gap: 5px; }
.home-summary b { color: var(--txt); }

/* ── Complete / Result view ── */
.complete-banner {
  background: linear-gradient(135deg, var(--hdr-dk) 0%, var(--brown) 100%);
  color: #fff; padding: 22px 18px; border-radius: 14px; margin-bottom: 14px; text-align: center;
}
.complete-banner h2 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.complete-banner p { font-size: 14px; color: #C8DCEF; margin-top: 4px; }
.readjust-btn {
  background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.28); color: #fff;
  padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; margin-top: 12px;
  transition: background .15s; display: inline-flex; align-items: center; gap: 6px;
}
.readjust-btn:hover { background: rgba(255,255,255,0.23); }

.result-card { background: var(--card); border: 1px solid var(--border-lt); border-radius: 14px; margin-bottom: 14px; overflow: hidden; animation: fadein .18s ease; }
.result-head { padding: 12px 16px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
.rh-packed { background: var(--packed-bg); color: var(--packed); }
.rh-later  { background: var(--later-bg); color: var(--later); }
.rh-skip   { background: var(--skip-bg); color: var(--skip); }
.result-head-label { display: flex; align-items: center; gap: 7px; }
.result-head-count { font-weight: 400; font-size: 13px; opacity: .75; }
.result-item { padding: 10px 16px; border-bottom: 1px solid #F1EBDD; display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--txt); }
.result-item:last-child { border-bottom: none; }
.ri-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ri-tag { font-size: 12px; background: var(--bg); color: var(--txt-mid); padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border-lt); }

/* ── Edit mode（輸入框 16px，iOS 點選時不會放大頁面）── */
.edit-panel { background: var(--card); border: 1px solid var(--border-lt); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.edit-sec-title { font-size: 13px; color: var(--txt-mid); font-weight: 500; margin-bottom: 12px; }
.edit-cat { border: 1.5px solid var(--border-lt); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.edit-cat-head { background: var(--packed-bg); padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-lt); }
.edit-cat-input { flex: 1; border: none; background: transparent; font-weight: 700; font-size: 17px; color: var(--txt); outline: none; min-width: 0; padding: 2px 6px; border-radius: 6px; }
.edit-cat-input:focus { background: #fff; }
.edit-items-list { padding: 10px; }
.edit-item-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.move-controls { display: flex; gap: 4px; flex-shrink: 0; }
.movebtn { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--packed); font-size: 15px; line-height: 1; cursor: pointer; }
.movebtn:hover:not(:disabled) { background: var(--packed-bg); border-color: var(--packed); }
.movebtn:disabled { opacity: .28; cursor: default; }
.edit-item-input { flex: 1; border: 1.5px solid var(--border-lt); border-radius: 8px; padding: 6px 10px; font-size: 16px; outline: none; color: var(--txt); min-width: 0; background: var(--card); }
.edit-item-input:focus { border-color: var(--brown); }
.delbtn { background: none; border: none; color: #C07060; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; font-size: 15px; line-height: 1; flex-shrink: 0; transition: background .15s; }
.delbtn:hover { background: #FDE8E0; }
.add-item-btn, .add-cat-btn {
  display: block; width: 100%; background: none; border: 1.5px dashed var(--border); color: var(--txt-mid);
  padding: 8px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: center; transition: all .15s;
}
.add-cat-btn { padding: 12px; border-radius: 12px; font-size: 15px; margin-top: 4px; }
.add-item-btn:hover, .add-cat-btn:hover { border-color: var(--brown); color: var(--brown); background: var(--card-alt); }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 52px 20px; color: var(--txt-muted); }
.empty-icon { display: flex; justify-content: center; margin-bottom: 12px; opacity: .6; }
.empty-text { font-size: 15px; }

@media (max-width: 400px) {
  .item-row { gap: 8px; padding-left: 12px; padding-right: 10px; }
  .item-btns { gap: 5px; }
  .ibtn { width: 38px; height: 38px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="hdr"><div class="wrap">
  <h1 class="hdr-title" id="hdrTitle"></h1>
  <div class="hdr-actions">
    <button class="hbtn" id="editBtn" type="button" onclick="toggleEdit()"></button>
    <button class="hbtn" id="resetBtn" type="button" onclick="confirmReset()"></button>
  </div>
</div></header>

<nav class="tabs-bar" aria-label="依狀態篩選"><div class="wrap tabs" id="tabs"></div></nav>
<main class="wrap main" id="main"></main>

<script>
'use strict';

// ── SVG icons ─────────────────────────────────────────────────────────────
const P = {
  luggage:  `<rect x="3" y="9" width="18" height="13" rx="2"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="10" y1="15" x2="14" y2="15"/>`,
  pencil:   `<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>`,
  checkdone:`<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`,
  refresh:  `<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-6.5"/>`,
  check:    `<polyline points="20 6 9 17 4 12"/>`,
  clock:    `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
  ban:      `<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>`,
  inbox:    `<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>`,
  star:     `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
  warning:  `<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
  list:     `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>`,
  home:     `<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>`,
  hourglass:`<path d="M6 2h12M6 22h12"/><path d="M7 2v3.5a5 5 0 0 0 2.5 4.3L12 11.5l2.5-1.7A5 5 0 0 0 17 5.5V2"/><path d="M7 22v-3.5a5 5 0 0 1 2.5-4.3L12 12.5l2.5 1.7a5 5 0 0 1 2.5 4.3V22"/>`,
};

function ic(name, sz=15, extra='') {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex-shrink:0;${extra}">${P[name]}</svg>`;
}

// ── Constants ──────────────────────────────────────────────────────────────
const KEY = 'packingTool_v3';
const configParams = new URLSearchParams(location.search);
const SUPABASE_URL = configParams.get('supabaseUrl');
const SUPABASE_KEY = configParams.get('supabaseKey');
if (!SUPABASE_URL || !SUPABASE_KEY) throw new Error('Missing Supabase configuration');
const packingDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { P:'pending', K:'packed', L:'later', X:'skip' };
const LABEL = { pending:'待思考', packed:'已收起', later:'待收起', skip:'不需要' };

const TABS_DEF = [
  { id:'all', label:'全部' },
  { id:S.P,   label:LABEL.pending },
  { id:S.K,   label:LABEL.packed  },
  { id:S.L,   label:LABEL.later   },
  { id:S.X,   label:LABEL.skip    },
];

// ── Default list ───────────────────────────────────────────────────────────
const DEFAULTS = [
  { id:'clothes', name:'衣服', items:[
    '外出衣','睡衣','內衣褲','襪子','毛巾',
    '保暖用品：圍巾、帽子','皮帶','拖鞋','塑膠袋'
  ]},
  { id:'makeup', name:'化妝品', items:[
    '粉底','遮瑕/細節刷','蜜粉/粉刷','眼影','修容/眼影刷',
    '腮紅/修容刷','眼線膠筆','眉粉','睫毛膏/燙睫毛','口紅','護唇膏'
  ]},
  { id:'toiletries', name:'盥洗用品', items:[
    '棉花棒','化妝棉','護墊/棉條','化妝水',
    '隱眼/隱眼盒/隱眼藥水','眼鏡盒','太陽眼鏡',
    '臉乳液','身體乳液','防曬','牙刷、牙膏、牙杯',
    '梳子','髮圈/髮夾','耳環/戒指',
    '劉海捲','離子夾','指甲用品：假指甲？指甲油？去光水？'
  ]},
  { id:'daily', name:'生活用品', items:[
    '充電線（type-C, lightening）','行動電源','電腦','電子書？',
    '雨傘','轉接插頭','手機/手機掛繩','Sim卡針'
  ]},
  { id:'travel', name:'旅行用品', items:[
    '包包（小包）','止痛藥','證件','現金'
  ]},
];

// ── State ──────────────────────────────────────────────────────────────────
let cats     = [];
let curTab   = 'all';
let editMode = false;
let catView  = false;

// ── Persistence ─────────────────────────────────────────────────────────────
function mkDefault() {
  return DEFAULTS.map(c => ({
    id: c.id, name: c.name,
    items: c.items.map((n,i) => ({ id:`${c.id}_${i}`, name:n, status:S.P, home:null }))
  }));
}

async function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY)||'null');
    if (d && Array.isArray(d.cats)) cats = d.cats;
  } catch(e) {}
  try {
    const { data } = await packingDb.from('packing_state').select('data').eq('id', 1).maybeSingle();
    if (data?.data?.cats && Array.isArray(data.data.cats)) cats = data.data.cats;
  } catch(e) { console.warn('Supabase load failed; using local copy', e); }
  if (!cats.length) cats = mkDefault();
  localStorage.setItem(KEY, JSON.stringify({ cats }));
}

let saveTimer;
function save() {
  const data = { cats };
  localStorage.setItem(KEY, JSON.stringify(data));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await packingDb.from('packing_state').upsert({ id: 1, data, updated_at: new Date().toISOString() });
    } catch(e) { console.warn('Supabase sync failed; saved locally', e); }
  }, 350);
}

// ── Stats ──────────────────────────────────────────────────────────────────
function stats() {
  const s = { total:0, pending:0, packed:0, later:0, skip:0 };
  cats.forEach(c => c.items.forEach(i => { s.total++; s[i.status]++; }));
  return s;
}

// ── Actions ────────────────────────────────────────────────────────────────
function setItem(cid, iid, status) {
  const c = cats.find(c=>c.id===cid); if(!c) return;
  const i = c.items.find(i=>i.id===iid); if(!i) return;
  i.status = (i.status===status) ? S.P : status;
  if (i.status !== S.K) i.home = null;
  catView = false;
  save(); render();
}

function setCat(cid, status) {
  const c = cats.find(c=>c.id===cid); if(!c) return;
  const allSame = c.items.every(i=>i.status===status);
  c.items.forEach(i=>{
    i.status = allSame ? S.P : status;
    if (i.status !== S.K) i.home = null;
  });
  catView = false;
  save(); render();
}

function setHome(cid, iid, home) {
  const c = cats.find(c=>c.id===cid); if(!c) return;
  const i = c.items.find(i=>i.id===iid); if(!i || i.status!==S.K) return;
  i.home = (i.home===home) ? null : home;
  save(); render();
}

function setCatHome(cid, home) {
  const c = cats.find(c=>c.id===cid); if(!c) return;
  const packed = c.items.filter(i=>i.status===S.K); if(!packed.length) return;
  const allSame = packed.every(i=>i.home===home);
  packed.forEach(i=>{ i.home = allSame ? null : home; });
  save(); render();
}

function confirmReset() {
  if (!confirm('確定要重置所有物品的狀態嗎？\n（清單不變，只把所有狀態清回「待思考」）')) return;
  cats.forEach(c=>c.items.forEach(i=>{ i.status=S.P; i.home=null; }));
  catView = false;
  save(); render();
}

function toggleEdit() {
  if (editMode) {
    cats = cats.filter(c=>c.name.trim());
    cats.forEach(c=>{ c.items=c.items.filter(i=>i.name.trim()); });
    save();
  }
  editMode = !editMode;
  updateStaticUI();
  render();
}

function switchTab(id) { curTab = id; render(); }

function updCat(id,v)       { const c=cats.find(c=>c.id===id); if(c){c.name=v;save();} }
function updItem(cid,iid,v) {
  const c=cats.find(c=>c.id===cid); if(!c) return;
  const i=c.items.find(i=>i.id===iid); if(i){i.name=v;save();}
}
function delCat(id) {
  if(!confirm('確定刪除這個分類？')) return;
  cats=cats.filter(c=>c.id!==id); save(); render();
}
function delItem(cid,iid) {
  const c=cats.find(c=>c.id===cid); if(!c) return;
  c.items=c.items.filter(i=>i.id!==iid); save(); render();
}
function moveItem(cid,iid,direction) {
  const c=cats.find(c=>c.id===cid); if(!c) return;
  const from=c.items.findIndex(i=>i.id===iid); if(from<0) return;
  const to=from+direction; if(to<0 || to>=c.items.length) return;
  const [item]=c.items.splice(from,1);
  c.items.splice(to,0,item);
  save(); render();
}
function addItem(cid) {
  const c=cats.find(c=>c.id===cid); if(!c) return;
  const id = cid+'_'+Date.now();
  c.items.push({ id, name:'', status:S.P, home:null });
  save(); render();
  queueMicrotask(()=>{
    // 聚焦在這個分類剛新增的那一格（原本會跳到整份清單最後一格，畫面因此捲到最下面）
    const el=document.querySelector(`.edit-item-input[data-iid="${id}"]`);
    if (!el) return;
    el.focus({ preventScroll:true });
    el.scrollIntoView({ block:'nearest' });
  });
}
function addCat() {
  cats.push({ id:'cat_'+Date.now(), name:'', items:[] });
  save(); render();
  queueMicrotask(()=>{ const el=document.querySelectorAll('.edit-cat-input'); el[el.length-1]?.focus(); });
}

// ── Static UI ──────────────────────────────────────────────────────────────
function updateStaticUI() {
  document.getElementById('hdrTitle').textContent = '家私備忘錄';
  const eb = document.getElementById('editBtn');
  if (editMode) {
    eb.innerHTML = `${ic('checkdone',16)} 完成編輯`;
    eb.classList.add('active');
  } else {
    eb.innerHTML = `${ic('pencil',16)} 編輯清單`;
    eb.classList.remove('active');
  }
  document.getElementById('resetBtn').innerHTML = `${ic('refresh',16)} 重置狀態`;
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  const scrollY = window.scrollY;
  const st   = stats();

  document.getElementById('tabs').innerHTML = TABS_DEF.map(t => {
    const n = t.id==='all' ? st.total : st[t.id];
    return `<div class="tab ${curTab===t.id?'active':''}" role="button" tabindex="0" aria-pressed="${curTab===t.id}" onclick="switchTab('${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('${t.id}')}">
      ${t.label}<span class="cnt">${n}</span></div>`;
  }).join('');

  const main     = document.getElementById('main');
  if (editMode) { main.innerHTML = renderEdit(); window.scrollTo(0, scrollY); return; }

  const complete = st.pending===0 && st.total>0;
  if (complete && curTab==='all' && !catView) { main.innerHTML = renderResult(); window.scrollTo(0, scrollY); return; }

  const isPackedTab = curTab === S.K;

  const visCats = cats.map(c=>({
    ...c, items: curTab==='all' ? c.items : c.items.filter(i=>i.status===curTab)
  })).filter(c=>c.items.length);

  if (!visCats.length) {
    main.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${ic('inbox',40)}</div>
      <div class="empty-text">這個狀態目前沒有物品</div>
    </div>`;
    window.scrollTo(0, scrollY);
    return;
  }

  let html = '';

  if (isPackedTab) {
    const packedAll = cats.flatMap(c=>c.items.filter(i=>i.status===S.K));
    const homeN  = packedAll.filter(i=>i.home==='home').length;
    const laterN = packedAll.filter(i=>i.home==='later').length;
    html += `<div class="home-summary">
      <span>${ic('home',16)} 已帶回家 <b>${homeN}</b></span>
      <span>${ic('hourglass',16)} 稍後帶回家 <b>${laterN}</b></span>
      <span>共 <b>${packedAll.length}</b> 項</span>
    </div>`;
  }

  html += visCats.map(c => {
    const orig = cats.find(x=>x.id===c.id);
    const d  = orig.items.filter(i=>i.status!==S.P).length;
    const aK = orig.items.every(i=>i.status===S.K);
    const aL = orig.items.every(i=>i.status===S.L);
    const aX = orig.items.every(i=>i.status===S.X);
    const packedInCat = orig.items.filter(i=>i.status===S.K);
    const aHome  = isPackedTab && packedInCat.length && packedInCat.every(i=>i.home==='home');
    const aLater = isPackedTab && packedInCat.length && packedInCat.every(i=>i.home==='later');
    return `
<div class="cat-card">
  <div class="cat-head">
    <span class="cat-title">${esc(c.name)}</span>
    <span class="cat-prog">${d}/${orig.items.length}</span>
    <div class="bulk-wrap">
      <button class="bbtn bp ${aK?'on':''}" onclick="setCat('${c.id}','${S.K}')">全已收</button>
      <button class="bbtn bl ${aL?'on':''}" onclick="setCat('${c.id}','${S.L}')">全待收</button>
      <button class="bbtn bs ${aX?'on':''}" onclick="setCat('${c.id}','${S.X}')">全不用</button>
      ${isPackedTab ? `
      <button class="bbtn bp ${aHome?'on':''}" onclick="setCatHome('${c.id}','home')">全帶回家</button>
      <button class="bbtn bl ${aLater?'on':''}" onclick="setCatHome('${c.id}','later')">全稍後</button>
      ` : ``}
    </div>
  </div>
  ${c.items.map(item=>`
  <div class="item-row s-${item.status}">
    <span class="dot"></span>
    <span class="item-name">${esc(item.name)}</span>
    <div class="item-btns">
      <button class="ibtn ip ${item.status===S.K?'on':''}" type="button" title="已收起" aria-label="${esc(item.name)}：已收起" aria-pressed="${item.status===S.K}" onclick="setItem('${c.id}','${item.id}','${S.K}')">${ic('check',19)}</button>
      <button class="ibtn il ${item.status===S.L?'on':''}" type="button" title="待收起" aria-label="${esc(item.name)}：待收起" aria-pressed="${item.status===S.L}" onclick="setItem('${c.id}','${item.id}','${S.L}')">${ic('clock',19)}</button>
      <button class="ibtn is ${item.status===S.X?'on':''}" type="button" title="不需要" aria-label="${esc(item.name)}：不需要" aria-pressed="${item.status===S.X}" onclick="setItem('${c.id}','${item.id}','${S.X}')">${ic('ban',19)}</button>
      ${isPackedTab ? `
      <button class="ibtn ih ${item.home==='home'?'on':''}" type="button" title="已帶回家" aria-label="${esc(item.name)}：已帶回家" aria-pressed="${item.home==='home'}" onclick="setHome('${c.id}','${item.id}','home')">${ic('home',19)}</button>
      <button class="ibtn it ${item.home==='later'?'on':''}" type="button" title="稍後帶回家" aria-label="${esc(item.name)}：稍後帶回家" aria-pressed="${item.home==='later'}" onclick="setHome('${c.id}','${item.id}','later')">${ic('hourglass',19)}</button>
      ` : ``}
    </div>
  </div>`).join('')}
</div>`;
  }).join('');

  main.innerHTML = html;
  window.scrollTo(0, scrollY);
}

function renderResult() {
  const groups = [
    { st:S.K, label:'已收起', cls:'rh-packed', icon:'check' },
    { st:S.L, label:'待收起', cls:'rh-later',  icon:'clock' },
    { st:S.X, label:'不需要', cls:'rh-skip',   icon:'ban'   },
  ];

  let html = `<div class="complete-banner">
    <h2>${ic('star',20,'margin-right:2px')} 全部分類完成！</h2>
    <p>以下是依照狀態整理的結果</p>
    <button class="readjust-btn" onclick="catView=true;render()">${ic('list',15)} 切回分類檢視</button>
  </div>`;

  groups.forEach(g => {
    const entries=[];
    cats.forEach(c=>c.items.filter(i=>i.status===g.st).forEach(i=>entries.push({name:i.name,cat:c.name})));
    if(!entries.length) return;
    html += `<div class="result-card">
      <div class="result-head ${g.cls}">
        <span class="result-head-label">${ic(g.icon,17)} ${g.label}</span>
        <span class="result-head-count">${entries.length} 項</span>
      </div>
      ${entries.map(e=>`<div class="result-item">
        <span class="ri-name">${esc(e.name)}</span>
        <span class="ri-tag">${esc(e.cat)}</span>
      </div>`).join('')}
    </div>`;
  });
  return html;
}

function renderEdit() {
  let html = `<div class="edit-panel">
    <div class="edit-sec-title">編輯清單　修改名稱或用箭頭調整順序</div>`;

  cats.forEach(c => {
    html += `<div class="edit-cat">
      <div class="edit-cat-head">
        <input class="edit-cat-input" value="${esc(c.name)}" placeholder="分類名稱"
          oninput="updCat('${c.id}',this.value)" />
        <button class="delbtn" onclick="delCat('${c.id}')" title="刪除分類">✕</button>
      </div>
      <div class="edit-items-list">
        ${c.items.map((i,index)=>`<div class="edit-item-row">
          <input class="edit-item-input" data-iid="${esc(i.id)}" value="${esc(i.name)}" placeholder="物品名稱"
            oninput="updItem('${c.id}','${i.id}',this.value)" />
          <div class="move-controls" aria-label="調整物品順序">
            <button class="movebtn" onclick="moveItem('${c.id}','${i.id}',-1)" title="上移" ${index===0?'disabled':''}>↑</button>
            <button class="movebtn" onclick="moveItem('${c.id}','${i.id}',1)" title="下移" ${index===c.items.length-1?'disabled':''}>↓</button>
          </div>
          <button class="delbtn" onclick="delItem('${c.id}','${i.id}')" title="刪除物品">✕</button>
        </div>`).join('')}
        <button class="add-item-btn" onclick="addItem('${c.id}')">＋ 新增物品</button>
      </div>
    </div>`;
  });

  html += `<button class="add-cat-btn" onclick="addCat()">＋ 新增分類</button>
  </div>`;
  return html;
}

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  await load();
  updateStaticUI();
  render();
}
boot();
</script>
</body>
</html>
